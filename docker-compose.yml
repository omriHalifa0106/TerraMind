x-py: &py
  build: { context: ., dockerfile: docker/python.Dockerfile }
  env_file: .env
  environment:
    DATABASE_URL: postgresql://terramind:terramind@db:5432/terramind
    MOCK_ALERTS_URL: http://mock-alerts:8200
    MCP_GIS_URL: http://mcp-gis:8101/mcp
    MCP_KNOWLEDGE_URL: http://mcp-knowledge:8102/mcp
    MCP_WEATHER_URL: http://mcp-weather:8103/mcp
    MCP_ALERTS_URL: http://mcp-alerts:8104/mcp
    MCP_BIND_HOST: 0.0.0.0   # inside a container; the host ports below are bound to 127.0.0.1
  profiles: ["full"]

services:
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: terramind
      POSTGRES_PASSWORD: terramind
      POSTGRES_DB: terramind
    ports: ["127.0.0.1:5433:5432"]   # host port 5433 (avoids another local PostgreSQL), local only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terramind -d terramind"]
      interval: 5s
      retries: 10

  # --- OSRM: real road drive times for agent 4. The Israel OSM extract is downloaded and
  # prepared once into the osrm-data volume (a few minutes); later starts reuse it. ---
  osrm-download:
    image: curlimages/curl:8.11.1
    user: root
    volumes: ["osrm-data:/data"]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        test -s /data/israel.osm.pbf ||
        (curl -fL --retry 3 -o /data/israel.osm.pbf.part
        https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf
        && mv /data/israel.osm.pbf.part /data/israel.osm.pbf)

  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    depends_on:
      osrm-download: { condition: service_completed_successfully }
    volumes: ["osrm-data:/data"]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        test -f /data/israel.osrm.mldgr ||
        (osrm-extract -p /opt/car.lua /data/israel.osm.pbf
        && osrm-partition /data/israel.osrm
        && osrm-customize /data/israel.osrm)

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    depends_on:
      osrm-prepare: { condition: service_completed_successfully }
    command: osrm-routed --algorithm mld /data/israel.osrm
    ports: ["127.0.0.1:5000:5000"]   # local only
    volumes: ["osrm-data:/data"]
    restart: unless-stopped

  mock-alerts:
    <<: *py
    profiles: []   # always on
    command: uvicorn services.mock_alerts_api.main:app --host 0.0.0.0 --port 8200
    ports: ["127.0.0.1:8200:8200"]

  mcp-gis:
    <<: *py
    depends_on:
      db: { condition: service_healthy }
    command: python -m mcp_servers.gis_server.server
    ports: ["127.0.0.1:8101:8101"]

  mcp-knowledge:
    <<: *py
    depends_on:
      db: { condition: service_healthy }
    command: python -m mcp_servers.knowledge_server.server
    ports: ["127.0.0.1:8102:8102"]
    volumes: ["hf-cache:/root/.cache/huggingface"]   # keep bge-m3 weights between runs

  mcp-weather:
    <<: *py
    command: python -m mcp_servers.weather_server.server
    ports: ["127.0.0.1:8103:8103"]

  mcp-alerts:
    <<: *py
    depends_on: [mock-alerts]
    command: python -m mcp_servers.alerts_server.server
    ports: ["127.0.0.1:8104:8104"]

  pipeline:   # scheduled weather + alerts ingestion into PostGIS
    <<: *py
    depends_on:
      db: { condition: service_healthy }
      mock-alerts: { condition: service_started }
    command: python -m ingestion.pipeline

  api:
    <<: *py
    command: uvicorn terramind.api.main:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      mcp-gis: { condition: service_started }
      mcp-knowledge: { condition: service_started }
      mcp-weather: { condition: service_started }
      mcp-alerts: { condition: service_started }

volumes:
  osrm-data:
  pgdata:
  hf-cache:
